[project]
name = "shrinkwrap"
version = "1.0.0"
description = "A tool to simplify the process of building and running firmware on Arm Fixed Virtual Platforms (FVP)"
readme = "README.md"
requires-python = ">=3.10.6"
dependencies = [
    "pyyaml~=6.0.1",
    "termcolor~=1.1.0",
    "tuxmake~=1.29.3",
]

[project.optional-dependencies]
runtime = [
    "shrinkwrap[runtime-edk2,runtime-op-tee,runtime-tf-a]",
]
runtime-edk2 = [
    "cmake~=3.31.6",
]
runtime-op-tee = [
    "cryptography~=45.0.5",
    "pyelftools~=0.32",
]
runtime-tf-a = [
    "fdt~=0.3.3",
]

[dependency-groups]
dev = [
    {include-group = "docs"},
    "requests~=2.32.4",
]
docs = [
    "sphinx~=7.0.1",
    "sphinx-copybutton~=0.5.2",
    "sphinx-rtd-theme~=1.3.0",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project.scripts]
shrinkwrap = "shrinkwrap.shrinkwrap:main"

[tool.uv.build-backend]
module-name = "shrinkwrap"
module-root = ""
