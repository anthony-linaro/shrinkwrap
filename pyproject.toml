[project]
name = "shrinkwrap"
version = "1.0.0"
description = "A tool to simplify the process of building and running firmware on Arm Fixed Virtual Platforms (FVP)"
readme = "README.md"
requires-python = ">=3.10.6"
dependencies = [
    "pyyaml~=6.0.1",
    "termcolor~=1.1.0",
    "tuxmake~=1.29.3",
]

[dependency-groups]
dev = [
    "requests~=2.32.4",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project.scripts]
shrinkwrap = "shrinkwrap.shrinkwrap:main"

[tool.uv.build-backend]
module-name = "shrinkwrap"
module-root = ""
