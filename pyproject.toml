[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkwraptool"
dynamic = ["version"]
authors = [
  { name="Ryan Roberts", email="ryan.roberts@arm.com" },
  { name="Saul Romero D", email="saul.romerodominguez@arm.com" }
]

description = "Shrinkwrap is a tool to simplify the process of building and running firmware on Arm Fixed Virtual Platforms (FVP)."
readme = "README.md"
requires-python = ">=3.9.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["license*"]

dependencies = [
  "PyYAML>=6.0.3",
  "tuxmake>=1.34.0",
  # termcolor 3.x requires Python >= 3.10
  "termcolor>=2.4.0,<3.0; python_version < '3.10'",
  "termcolor>=3.2.0; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
  "build",
  "twine",
  "pytest",
]

docs = [
  "Sphinx>=8.2,<10",
  "sphinx-rtd-theme>=3.1.0,<4",
  "sphinx-copybutton>=0.5.2",
]

[project.urls]
Homepage = "https://git.gitlab.arm.com/tooling/shrinkwrap"

[project.scripts]
shrinkwrap = "shrinkwrap.shrinkwrap_main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
shrinkwrap = [
  "config/**/*.yaml",
  "config/**/*.config",
]

[tool.setuptools.dynamic]
version = { attr = "shrinkwrap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
