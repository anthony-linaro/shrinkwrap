%YAML 1.2
---
description: >-
  Rusted-Firmware-A. This provides a baseline configuration that can be
  customized by higher layers.

layers:
  - rust.yaml

build:
  rfa:
    params:
      PLAT: fvp
      DEBUG: $$( test '${btvar:TFA_BUILD}' != debug ; echo $$? )
      OBJCOPY: aarch64-none-elf-objcopy
      CARGO_TARGET_DIR: ${artifact:RFA_OUT}

    repo:
      remote: https://git.trustedfirmware.org/RF-A/rusted-firmware-a
      revision: v0.2.0

    prebuild:
      # Calling rustup to install the toolchain / components described
      # by `rust-toolchain.toml`
      - source ${artifact:RUST_ENV}
      - rustup show

    build:
      - source ${artifact:RUST_ENV}
      - make -j${param:jobs} ${param:join_equal} build

    artifacts:
      RFA_OUT:
        path: ${param:builddir}/fvp/${btvar:TFA_BUILD}
        export: false
      RFA_BL31: ${artifact:RFA_OUT}/bl31.bin

buildex:
  btvars:
    TFA_BUILD:
      type: string
      options:
        - release
        - debug
      value: release
